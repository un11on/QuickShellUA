# CAVA config for Music Island (TopBar).
# Raw ASCII output is consumed by CavaBars.qml; colours are applied in QML
# from Theme.accent, so this file only defines capture and output format.

[general]
bars = 10
framerate = 60
sensitivity = 120

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono
